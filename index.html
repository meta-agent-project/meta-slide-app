<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>슬라이드룸 · HTML 스튜디오</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="#"><span class="logo">s.</span> 슬라이드룸 <small>HTML STUDIO</small></a><input id="projectName" aria-label="프로젝트 이름" value="나의 첫 번째 프레젠테이션"><div class="header-actions"><span id="saveState">로컬 자동 저장</span><button id="openBtn">열기</button><button id="previewBtn">▷ 미리보기</button><button class="primary" id="exportBtn">HTML 내보내기 ↗</button></div></header>
<nav class="toolbar"><div><button id="undoBtn" title="실행 취소 Ctrl+Z">↶</button><button id="redoBtn" title="다시 실행 Ctrl+Shift+Z">↷</button></div><i></i><div><button data-add="text"><b>T</b> 텍스트</button><button data-add="rect"><b>□</b> 도형</button><button data-add="circle"><b>○</b> 원</button><button id="imageBtn"><b>▧</b> 이미지</button></div><i></i><span>아이디어를 놓고, 자유롭게 다듬으세요.</span><button id="duplicateBtn" class="right">복제</button><button id="deleteBtn">삭제</button></nav>
<main><aside class="slides-panel"><div class="panel-heading">슬라이드 <span id="slideCount">01</span></div><div id="slides"></div><button id="addSlide" class="add-slide">＋ 슬라이드 추가</button><div class="sidebar-note"><span>YOUR IDEAS, YOUR CANVAS</span><p>코드 없이 만드는<br>나만의 웹 프레젠테이션.</p></div></aside>
<section class="workspace"><div class="workspace-heading"><span id="slideLabel">SLIDE 01</span><span>16:9 · 1280 × 720</span></div><div id="stageArea"><div id="stageWrap"><div id="stage"></div></div></div><div class="canvas-help"><span>더블클릭으로 글자 편집</span><span>드래그로 이동</span><span>모서리로 크기 조절</span></div><footer><span><em></em> 모든 작업은 이 브라우저에 저장됩니다</span><div><button id="zoomOut" aria-label="축소">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="확대">＋</button><button id="fitBtn">화면 맞춤</button></div></footer></section>
<aside class="properties"><div class="panel-heading">디자인 <span>⚙</span></div><div class="selection-name" id="selectionName">슬라이드 배경</div><section><h3>색상</h3><label class="color-row"><span id="colorLabel">배경색</span><input type="color" id="colorInput" value="#f5f2eb"><output id="colorHex">#F5F2EB</output></label><div class="swatches" id="swatches"></div></section><div id="elementProps" hidden><section><h3>위치와 크기</h3><div class="fields"><label>X <input id="propX" type="number"></label><label>Y <input id="propY" type="number"></label><label>W <input id="propW" type="number" min="20"></label><label>H <input id="propH" type="number" min="20"></label></div></section><section id="textProps"><h3>텍스트</h3><select id="fontFamily" aria-label="글꼴"><option value="sans-serif">기본 산세리프</option><option value="serif">세리프</option><option value="monospace">모노스페이스</option></select><div class="text-tools"><input id="fontSize" aria-label="글자 크기" type="number" min="8" max="200"><button id="boldBtn" title="굵게"><b>B</b></button><button id="alignBtn" title="정렬 변경">정렬</button></div></section><section><h3>레이어</h3><div class="layer-tools"><button id="backBtn">↓ 뒤로</button><button id="frontBtn">↑ 앞으로</button></div></section></div><section class="tip"><span>작은 팁</span><p>텍스트와 도형을 조합해<br>아이디어를 한 장에 담아보세요.</p><kbd>Ctrl</kbd> + <kbd>D</kbd> <span>요소 복제</span></section><button id="removeSlide">슬라이드 삭제</button></aside></main>
<input type="file" id="imageFile" accept="image/*" hidden><input type="file" id="projectFile" accept=".html,.json" hidden><div id="toast" role="status"></div>
<dialog id="preview"><button id="closePreview">닫기 ✕</button><iframe id="previewFrame" title="HTML 미리보기" sandbox=""></iframe></dialog><script src="app.js"></script>
</body></html>
