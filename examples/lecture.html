-sr-id=\"2c21002d-6631-48e5-8964-661784e2150c\">그 생각을 뒷받침하는 근거는 무엇일까요?\u003c/td>\u003c/tr>\u003ctr data-sr-id=\"47d0b9b9-ee0c-4d37-8e68-30c492afd9cd\">\u003ctd data-sr-id=\"9a9ec515-976f-434a-8328-c95af2bf79ee\">관점 확장\u003c/td>\u003ctd data-sr-id=\"6c821d6f-ebf5-4162-a313-98bf10cdf0db\">다른 입장에서는 어떻게 볼 수 있을까요?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"footer\" data-caption=\"\" data-sr-id=\"5935609d-5921-43af-92c1-0128a0e59838\">표를 더블클릭하면 셀 내용을 직접 바꿀 수 있습니다.\u003c/p>\u003c/section>\n\n\u003cscript>const canvas=document.querySelector('canvas');if(canvas){const ctx=canvas.getContext('2d');function draw(t){ctx.clearRect(0,0,380,280);ctx.fillStyle='#dce5d6';ctx.beginPath();ctx.arc(190,140,105,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eab285';ctx.beginPath();ctx.arc(190+Math.sin(t/900)*72,140+Math.cos(t/900)*72,28,0,Math.PI*2);ctx.fill();requestAnimationFrame(draw)}requestAnimationFrame(draw)}\u003c/script>\n\n\u003c/body>\u003c/html>"},{"id":"0dfda485-674b-4782-8fba-721de9b1b98a","name":"하나의 질문을 바꿔보세요.","html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003ctitle>좋은 질문으로 시작하는 수업\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;font-family:Arial,\"Malgun Gothic\",sans-serif;color:#253f38;background:#f8f6f0}[data-slide]{width:1280px;height:720px;position:relative;overflow:hidden;background:#f8f6f0;padding:64px}h1,h2,p{margin:0}h1{font-size:66px;line-height:1.24}h2{font-size:50px;line-height:1.25}.eyebrow{font-size:18px;letter-spacing:3px;color:#6d8576;margin-bottom:34px}.body{font-size:28px;line-height:1.6}.footer{position:absolute;left:64px;bottom:32px;font-size:16px;color:#819084}.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:50px}.card{background:white;padding:30px;border-radius:18px}.card h3{font-size:30px;margin:0 0 22px}.card p{font-size:26px;line-height:1.6}table{border-collapse:collapse;width:100%;font-size:26px;table-layout:fixed;margin-top:50px}td,th{padding:22px;border:1px solid #b9cabc;text-align:left;line-height:1.5}th{background:#dce5d6}td{background:#fff}.note{font-size:22px;color:#7b897e;line-height:1.5}\n\u003c/style>\u003cstyle data-sr-page-style=\"\">html,body{margin:0!important;overflow:hidden!important} [data-sr-page]{margin:0!important;box-sizing:border-box;min-height:720px}\u003c/style>\u003c/head>\u003cbody>\n\n\n\n\n\u003csection data-slide=\"5\" data-sr-id=\"997fb242-a313-4fa3-9cd4-83659f677d04\" data-sr-page=\"\" class=\"active\" style=\"visibility: visible !important;\">\u003cp class=\"eyebrow\" data-sr-id=\"fd6b0629-1eac-48f2-932e-ac59176bc69b\">TRY IT IN YOUR NEXT LESSON\u003c/p>\u003ch2 data-sr-id=\"747f88fb-69b8-4a27-93ff-d03f35190dd4\">하나의 질문을 바꿔보세요.\u003c/h2>\u003cp class=\"body\" style=\"position:absolute;left:64px;top:260px;width:630px\" data-sr-id=\"96db87ce-67ba-427c-9435-3e8e675b5990\">다음 수업에서 사용할 질문 하나를 고르고,\u003cbr>학생의 생각을 더 들을 수 있도록\u003cbr>다시 써보세요.\u003c/p>\u003ccanvas data-sr-opaque=\"\" width=\"380\" height=\"280\" style=\"position:absolute;left:822px;top:270px;width:380px;height:280px\" aria-label=\"움직이는 생각의 점\" data-sr-id=\"09081562-cc89-40dd-9916-bf4e505642a1\">\u003c/canvas>\u003cp class=\"footer\" data-caption=\"\" data-sr-id=\"221076b3-2d4e-4732-af97-bb7985e9aede\">오른쪽은 통째로 이동할 수 있는 애니메이션 예시입니다.\u003c/p>\u003c/section>\n\u003cscript>const canvas=document.querySelector('canvas');if(canvas){const ctx=canvas.getContext('2d');function draw(t){ctx.clearRect(0,0,380,280);ctx.fillStyle='#dce5d6';ctx.beginPath();ctx.arc(190,140,105,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eab285';ctx.beginPath();ctx.arc(190+Math.sin(t/900)*72,140+Math.cos(t/900)*72,28,0,Math.PI*2);ctx.fill();requestAnimationFrame(draw)}requestAnimationFrame(draw)}\u003c/script>\n\n\u003c/body>\u003c/html>"}]}</script><script>const frames=[...document.querySelectorAll('iframe')];let current=0;function show(n){current=Math.max(0,Math.min(frames.length-1,n));frames.forEach((f,i)=>f.hidden=i!==current);document.getElementById('counter').textContent=(current+1)+' / '+frames.length}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))show(current+1);if(['ArrowLeft','PageUp'].includes(e.key))show(current-1)});function fit(){document.getElementById('deck').style.transform='scale('+Math.min(innerWidth/1280,(innerHeight-56)/720)+')'}addEventListener('resize',fit);fit();show(0);</script></body></html>
